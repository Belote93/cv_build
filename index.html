<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CV Builder Pro • Professional Resume Builder</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Raleway:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Libre+Baskerville:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;700&family=Bebas+Neue&family=Oswald:wght@400;500;700&family=Cinzel:wght@400;500;600;700&family=Josefin+Sans:wght@300;400;500;600;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Quicksand:wght@400;500;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:wght@300;400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&family=Karla:wght@300;400;500;700&family=Nunito:wght@300;400;500;700&family=Rubik:wght@300;400;500;700&family=Heebo:wght@300;400;500;700&family=Lexend:wght@300;400;500;700&family=Manrope:wght@300;400;500;600;700&family=Public+Sans:wght@300;400;500;600;700&family=Libre+Franklin:wght@300;400;500;600;700&family=Urbanist:wght@300;400;500;600;700&family=Epilogue:wght@300;400;500;600;700&family=Saira:wght@300;400;500;600;700&family=Titillium+Web:wght@300;400;600;700&family=Overpass:wght@300;400;500;600;700&family=Assistant:wght@300;400;500;700&family=DM+Serif+Display&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Domine:wght@400;500;600;700&family=Prata&family=Cardo:ital,wght@0,400;0,700;1,400&family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0f1a;
            --card: #111827;
            --border: #1e293b;
            --text: #e2e8f0;
            --accent: #3b82f6;
            --sidebar-width: 440px;
            --cv-font-size: 11pt;
            --mobile-cv-scale: 0.33;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        /* ===== PAPER ===== */
        .paper-white {
            background: #fff;
            color: #0f172a;
        }
        .paper-cream {
            background: #faf8f5;
            color: #1c1917;
        }
        .paper-ivory {
            background: #fffff0;
            color: #1e1b4b;
        }
        .paper-gray {
            background: #f8f9fa;
            color: #1a1a2e;
        }
        .paper-dark {
            background: #1a1a2e;
            color: #e2e8f0;
        }
        .paper-warm {
            background: #fdf6e3;
            color: #1a1a1a;
        }
        .paper-cool {
            background: #f0f4f8;
            color: #1a202c;
        }

        /* ===== CV CONTENT ===== */
        .cv-content {
            font-size: var(--cv-font-size);
            line-height: 1.55;
        }
        .cv-content h1 {
            font-size: calc(var(--cv-font-size)*2.2);
            margin-bottom: 2px;
            line-height: 1.1;
        }
        .cv-content .section-title {
            font-weight: 700;
            border-bottom: 1.5px solid currentColor;
            padding-bottom: 3px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: calc(var(--cv-font-size)*0.95);
            opacity: 0.9;
        }
        .cv-content .job-title {
            font-weight: 700;
            font-size: calc(var(--cv-font-size)*1.02);
        }
        .cv-content .job-company {
            font-style: italic;
            font-size: calc(var(--cv-font-size)*0.9);
            opacity: 0.75;
        }
        .cv-content .job-date {
            font-size: calc(var(--cv-font-size)*0.85);
            opacity: 0.6;
        }
        .cv-content .skill-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 3px;
            font-size: calc(var(--cv-font-size)*0.82);
            margin: 2px 3px 2px 0;
        }
        .cv-content .cert-tag {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(59, 130, 246, 0.08);
            color: #1e40af;
            border-radius: 3px;
            font-size: calc(var(--cv-font-size)*0.82);
            margin: 2px 3px 2px 0;
            font-weight: 600;
        }
        .cv-content hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.12);
            margin: 14px 0;
        }
        .paper-dark .cv-content .skill-tag {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
        }
        .paper-dark .cv-content .cert-tag {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
        }

        .no-print {
            display: block;
        }
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white !important;
                overflow: auto !important;
            }
            #cv-capture-area {
                box-shadow: none !important;
                margin: 0 !important;
                width: 210mm !important;
                min-height: 297mm !important;
                padding: 15mm !important;
                transform: none !important;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: #0a0f1a;
            border-right: 1px solid #1e293b;
            overflow-y: auto;
            overflow-x: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 30;
        }
        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            border-right: none;
            padding: 0;
            overflow: hidden;
        }
        #sidebar-inner {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            padding: 16px;
            padding-bottom: 100px;
            transition: opacity 0.2s ease;
        }
        #sidebar.collapsed #sidebar-inner {
            opacity: 0;
        }

        /* Toggle button */
        #sidebar-toggle {
            position: absolute;
            top: 50%;
            right: -16px;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 35;
            color: #94a3b8;
            font-size: 14px;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        #sidebar-toggle:hover {
            background: #334155;
            color: white;
        }
        #sidebar.collapsed #sidebar-toggle {
            right: -40px;
            border-radius: 0 8px 8px 0;
            width: 36px;
            height: 48px;
            border-left: none;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            border: none;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        .btn-secondary {
            background: #334155;
            color: white;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
        }
        .btn-ghost {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #1e293b;
        }
        .btn-ghost:hover {
            background: #1a2332;
            color: white;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 10px;
            border-radius: 6px;
        }
        .btn-xs {
            padding: 3px 8px;
            font-size: 9px;
            border-radius: 5px;
        }

        .template-btn.active {
            background: #3b82f6 !important;
            color: white !important;
            border-color: #60a5fa !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        /* ===== INPUTS ===== */
        .input-field {
            width: 100%;
            padding: 10px 12px;
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 8px;
            font-size: 13px;
            color: white;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }
        .input-field::placeholder {
            color: #475569;
        }
        textarea.input-field {
            resize: vertical;
            min-height: 48px;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 12px;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        /* ===== BOTTOM SHEET ===== */
        .bottom-sheet-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 200;
            display: none;
            align-items: flex-end;
        }
        .bottom-sheet-overlay.show {
            display: flex;
        }
        .bottom-sheet {
            background: #111827;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-height: 82vh;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s ease-out;
        }
        .bottom-sheet-handle {
            width: 36px;
            height: 4px;
            background: #475569;
            border-radius: 2px;
            margin: 0 auto 14px;
        }

        /* ===== FONT LIST ===== */
        .font-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: #0a0f1a;
            border: 1.5px solid #1e293b;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 6px;
        }
        .font-list-item.active {
            border-color: #3b82f6;
            background: #0f1a2e;
        }
        .font-preview-box {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a2332;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 18px;
            font-weight: 600;
            flex-shrink: 0;
        }
        .font-info {
            flex: 1;
            min-width: 0;
        }
        .font-name {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
        }
        .font-desc {
            font-size: 11px;
            color: #64748b;
            margin-top: 1px;
        }

        /* ===== TEMPLATE CARD ===== */
        .template-card-mobile {
            background: #0a0f1a;
            border: 2px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
            width: 100%;
        }
        .template-card-mobile.active {
            border-color: #3b82f6;
            background: #0f1a2e;
        }

        /* ===== SPINNER ===== */
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        /* ===== MOBILE ===== */
        .mobile-tab-bar {
            display: none;
        }
        .mobile-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 4px;
            font-size: 9px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
        }
        .mobile-tab.active {
            color: #3b82f6;
        }
        .mobile-tab svg {
            width: 18px;
            height: 18px;
        }

        /* Mobile overlay sidebar */
        #mobile-sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 45;
        }
        #mobile-sidebar-overlay.show {
            display: block;
        }

        @media (max-width: 1024px) {
            #sidebar {
                position: fixed;
                top: 52px;
                bottom: 56px;
                left: 0;
                z-index: 50;
                transform: translateX(-100%);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                width: 85vw;
                max-width: 420px;
                min-width: 0;
                box-shadow: 4px 0 24px rgba(0, 0, 0, 0.5);
            }
            #sidebar.mobile-open {
                transform: translateX(0);
            }
            #sidebar.collapsed {
                transform: translateX(-100%);
                width: 85vw;
                max-width: 420px;
            }
            #sidebar-toggle {
                display: none;
            }
            #sidebar-inner {
                width: 100%;
                min-width: 0;
                padding-bottom: 80px;
            }
            .mobile-tab-bar {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: #0f172a;
                border-top: 1px solid #1e293b;
                z-index: 50;
                padding: 2px 0;
                padding-bottom: env(safe-area-inset-bottom, 6px);
            }
            #preview-panel {
                width: 100%;
                height: calc(100vh - 108px);
                height: calc(100dvh - 108px);
                overflow: auto;
                padding: 8px;
            }
            #cv-capture-area {
                width: 210mm !important;
                min-height: 297mm !important;
                padding: 15mm !important;
                transform: scale(var(--mobile-cv-scale));
                transform-origin: top center;
                margin-bottom: calc((var(--mobile-cv-scale) - 1) * 297mm);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5) !important;
            }
        }
        @media (max-width: 640px) {
            :root {
                --mobile-cv-scale: 0.33;
            }
        }
        @media (min-width: 641px) and (max-width: 1024px) {
            :root {
                --mobile-cv-scale: 0.48;
            }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- ==================== HEADER ==================== -->
    <header class="no-print bg-[#0a0f1a]/95 backdrop-blur-md border-b border-[#1e293b] px-3 sm:px-5 py-2.5 flex flex-wrap justify-between items-center gap-2 sticky top-0 z-50">
        <div class="flex items-center gap-2.5">
            <button onclick="toggleSidebar()" class="btn btn-ghost btn-sm !px-2 lg:hidden" title="Menu">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <button onclick="toggleSidebar()" class="hidden lg:flex btn btn-ghost btn-sm !px-2" title="Toggle Sidebar">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
            </button>
            <div class="w-9 h-9 sm:w-10 sm:h-10 bg-gradient-to-br from-blue-600 via-indigo-600 to-purple-600 rounded-lg flex items-center justify-center text-white font-black text-sm shadow-lg">CV</div>
            <h1 class="font-black text-xs sm:text-sm tracking-tight">CV BUILDER <span class="text-blue-400">PRO</span></h1>
        </div>
        <div class="flex flex-wrap gap-1.5 items-center">
            <!-- Language -->
            <button onclick="toggleLanguage()" class="btn btn-ghost btn-sm gap-1" title="PT / EN">
                <span id="langFlag">🇵🇹</span><span id="langLabel" class="hidden sm:inline">PT</span>
            </button>
            <!-- Paper -->
            <select id="paperColor" onchange="changePaperColor(this.value)" class="btn btn-ghost btn-sm text-white bg-[#111827]">
                <option value="white">📄</option><option value="cream">📜</option><option value="ivory">📝</option><option value="gray">📋</option><option value="warm">☕</option><option value="cool">❄️</option><option value="dark">🌙</option>
            </select>
            <!-- Font Size -->
            <div class="flex items-center gap-1 bg-[#111827] rounded-lg px-2 py-1">
                <button onclick="changeFontSize(-1)" class="text-white hover:text-blue-400 text-sm font-bold px-1">A-</button>
                <span id="fontSizeDisplay" class="text-[10px] text-slate-400 min-w-[28px] text-center">11pt</span>
                <button onclick="changeFontSize(1)" class="text-white hover:text-blue-400 text-sm font-bold px-1">A+</button>
            </div>
            <!-- Fonts -->
            <button onclick="openFontSelector()" class="btn btn-ghost btn-sm">🎨 <span class="hidden sm:inline">Fontes</span></button>
            <!-- Export -->
            <button onclick="exportToWord()" class="btn btn-secondary btn-sm">📝 <span class="hidden sm:inline">Word</span></button>
            <button onclick="exportToPDF()" class="btn btn-danger btn-sm">📄 <span class="hidden sm:inline">PDF</span></button>
        </div>
    </header>

    <!-- ==================== FONT SHEET ==================== -->
    <div id="fontSheet" class="bottom-sheet-overlay" onclick="closeFontSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="bottom-sheet-handle"></div>
            <h3 class="text-base font-bold text-white mb-3">🎨 Font Selector</h3>
            <div id="fontSheetContent"></div>
        </div>
    </div>

    <!-- ==================== TEMPLATE SHEET ==================== -->
    <div id="templateSheet" class="bottom-sheet-overlay" onclick="closeTemplateSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="bottom-sheet-handle"></div>
            <h3 class="text-base font-bold text-white mb-3">🎯 All Templates (24)</h3>
            <div class="grid grid-cols-2 gap-2" id="templateSheetGrid"></div>
        </div>
    </div>

    <!-- ==================== PDF OVERLAY ==================== -->
    <div id="pdf-export-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:14px;">
        <div class="spinner"></div>
        <p style="color:white;font-size:14px;font-weight:600">Preparing PDF...</p>
        <p style="font-size:11px;color:#94a3b8;max-width:280px;text-align:center">Use <strong style="color:white">Ctrl+P</strong> → Save as PDF</p>
    </div>

    <!-- ==================== MOBILE SIDEBAR OVERLAY ==================== -->
    <div id="mobile-sidebar-overlay" onclick="closeMobileSidebar()"></div>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="flex-1 flex overflow-hidden relative">
        <!-- SIDEBAR -->
        <aside id="sidebar">
            <div id="sidebar-inner" class="space-y-4">
                <!-- Quick Templates (5 principais) -->
                <div class="bg-[#111827]/70 rounded-xl p-3.5">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-[10px] font-bold uppercase tracking-wider text-slate-500">🎨 Templates</h3>
                        <button onclick="openTemplateSelector()" class="btn btn-primary btn-xs">24 Models</button>
                    </div>
                    <div class="grid grid-cols-1 gap-1.5">
                        <button onclick="setTemplate('classic')" class="template-btn active bg-[#1a2332] p-2.5 text-[10px] uppercase font-bold rounded-md border border-transparent hover:border-blue-500 transition-all text-white flex items-center gap-2">
                            <span class="text-lg">📜</span> Classic
                        </button>
                        <button onclick="setTemplate('corporate')" class="template-btn bg-[#1a2332] p-2.5 text-[10px] uppercase font-bold rounded-md border border-transparent hover:border-blue-500 transition-all text-white flex items-center gap-2">
                            <span class="text-lg">🏢</span> Corporate
                        </button>
                        <button onclick="setTemplate('executive')" class="template-btn bg-[#1a2332] p-2.5 text-[10px] uppercase font-bold rounded-md border border-transparent hover:border-blue-500 transition-all text-white flex items-center gap-2">

            executive: (p, exp, edu, skills, langs, certs) => `
            <div class="cv-content" style="font-family:${state.selectedFont}">
              <div style="background:linear-gradient(to right,#1a1a1a,#2d2d2d);color:white;padding:22px;margin:-15mm -15mm 18px -15mm"><h1 style="color:white;font-weight:300;letter-spacing:1.5px;font-size:calc(var(--cv-font-size)*2.2)">${p.name}</h1><p style="color:#ccc;text-transform:uppercase;letter-spacing:2px;font-size:calc(var(--cv-font-size)*.95)">${p.title}</p><div style="width:50px;height:2px;background:#d4af37;margin-top:8px"></div></div>
              <div style="display:flex;gap:10px;font-size:calc(var(--cv-font-size)*.78);opacity:.65;margin-bottom:14px;background:rgba(0,0,0,.03);padding:8px 10px;border-radius:3px;flex-wrap:wrap"><span>📧 ${p.email}</span><span>📱 ${p.phone}</span><span>📍 ${p.location}</span></div>
              <div class="section-title" style="border-color:#d4af37">${t('executive_summary')}</div><p style="font-size:calc(var(--cv-font-size)*.92);line-height:1.6;margin-bottom:14px">${p.summary}</p>
              ${exp.length?`<div class="section-title" style="border-color:#d4af37">${t('professional_experience')}</div>${expList(exp)}`:''}
              ${edu.length?`<div class="section-title" style="border-color:#d4af37">${t('education_section')}</div>${eduList(edu)}`:''}
              ${certs.length?`<div class="section-title" style="border-color:#d4af37">${t('certifications_section')}</div>${certBadges(certs)}`:''}
            </div>`,
            academic: (p, exp, edu, skills, langs, certs) => `
            <div class="cv-content" style="font-family:${state.selectedFont};text-align:center">
              <h1>${p.name}</h1><p style="font-size:calc(var(--cv-font-size)*1.15);font-style:italic;opacity:.7">${p.title}</p><p style="font-size:calc(var(--cv-font-size)*.85);opacity:.55">${p.email} • ${p.phone}</p><hr>
              <div class="section-title">${t('research_summary')}</div><p style="text-align:justify;font-style:italic;font-size:calc(var(--cv-font-size)*.92);line-height:1.6">${p.summary}</p>
              ${exp.length?`<div class="section-title" style="margin-top:18px">${t('academic_appointments')}</div><div style="text-align:left">${expList(exp)}</div>`:''}
              ${edu.length?`<div class="section-title" style="margin-top:18px">${t('education_section')}</div><div style="text-align:left">${eduList(edu)}</div>`:''}
              ${skills.length?`<div class="section-title" style="margin-top:18px">${t('research_interests')}</div><div style="text-align:left">${skillBadges(skills)}</div>`:''}
            </div>`,
            traditional: (p, exp, edu, skills, langs, certs) => `
            <div class="cv-content" style="font-family:${state.selectedFont}">
              <div style="text-align:center;border-bottom:2px solid currentColor;padding-bottom:14px;margin-bottom:18px"><h1 style="text-transform:uppercase;letter-spacing:1.5px">${p.name}</h1><p style="font-size:calc(var(--cv-font-size)*1.1);opacity:.7">${p.title}</p><p style="font-size:calc(var(--cv-font-size)*.8);opacity:.55;margin-top:3px">${contactLine(p)}</p></div>
              <div class="section-title" style="opacity:.8">${t('objective')}</div><p style="font-size:calc(var(--cv-font-size)*.92);line-height:1.6;margin-bottom:14px">${p.summary}</p>
              ${exp.length?`<div class="section-title" style="opacity:.8">${t('experience_section')}</div>${expList(exp)}`:''}
              ${edu.length?`<div class="section-title" style="opacity:.8">${t('education_section')}</div>${eduList(edu)}`:''}
            </div>`,
        };

        // Fallback para outros templates
        templateDefinitions.forEach(t => { if (!renderers[t.id]) renderers[t.id] = renderers['classic']; });

        // ==================== RENDER CV ====================
        function renderCV() {
            const preview = document.getElementById('cv-capture-area');
            const paperClassMap = { white: 'paper-white', cream: 'paper-cream', ivory: 'paper-ivory', gray: 'paper-gray',
                dark: 'paper-dark', warm: 'paper-warm', cool: 'paper-cool' };
            preview.className =
                `w-[210mm] min-h-[297mm] ${paperClassMap[state.paperColor]||'paper-white'} p-[15mm] shadow-2xl animate-fadeIn`;
            preview.style.fontFamily = state.selectedFont;
            preview.innerHTML = (renderers[state.template] || renderers['classic'])(
                state.personal, state.experience, state.education, state.skills, state.languages, state
                .certifications);
            updateTemplateButtons();
        }

        function updateTemplateButtons() {
            document.querySelectorAll('.template-btn').forEach(b => {
                b.classList.remove('active');
                if ((b.getAttribute('onclick') || '').includes(`'${state.template}'`)) b.classList.add('active');
            });
        }

        function setTemplate(t) { state.template = t;
            renderCV();
            showToast(`Template: ${t}`); }

        function changePaperColor(c) { state.paperColor = c;
            renderCV(); }

        // ==================== EXPORT ====================
        function buildPrintHTML() {
            const cvInner = document.getElementById('cv-capture-area').innerHTML;
            const fontLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
                .map(l => `<link rel="stylesheet" href="${l.href}">`).join('\n');
            const cs = state.cvFontSize;
            return `<!DOCTYPE html><html lang="${currentLang}"><head><meta charset="UTF-8"><title>CV</title>${fontLinks}<style>@page{size:A4 portrait;margin:15mm}:root{--cv-font-size:${cs}pt}body{width:210mm;background:${paperBg[state.paperColor]||'#fff'};color:${paperFg[state.paperColor]||'#111'};font-family:${state.selectedFont};-webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:297mm}.cv-content{font-size:var(--cv-font-size);line-height:1.55}.cv-content h1{font-size:calc(var(--cv-font-size)*2.2)}.cv-content .section-title{font-weight:700;border-bottom:1.5px solid currentColor;padding-bottom:3px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em;font-size:calc(var(--cv-font-size)*.95);opacity:.9}.skill-tag{display:inline-block;padding:2px 8px;background:rgba(0,0,0,.05);border-radius:3px;font-size:calc(var(--cv-font-size)*.82);margin:2px 3px 2px 0}.cert-tag{display:inline-block;padding:2px 8px;background:rgba(59,130,246,.08);color:#1e40af;border-radius:3px;font-size:calc(var(--cv-font-size)*.82);margin:2px 3px 2px 0;font-weight:600}.job-title{font-weight:700;font-size:calc(var(--cv-font-size)*1.02)}.job-company{font-style:italic;font-size:calc(var(--cv-font-size)*.9);opacity:.75}hr{border:none;border-top:1px solid rgba(0,0,0,.12);margin:14px 0}</style></head><body>${cvInner}</body></html>`;
        }

        function exportToPDF() {
            const overlay = document.getElementById('pdf-export-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                const w = window.open('', '_blank', 'width=900,height=700');
                if (!w) { overlay.style.display = 'none';
                    showToast('⚠️ Allow pop-ups'); return; }
                w.document.write(buildPrintHTML());
                w.document.close();
                w.onload = () => { setTimeout(() => { overlay.style.display = 'none';
                        w.focus();
                        w.print(); }, 400); };
                setTimeout(() => { overlay.style.display = 'none'; if (w && !w.closed) { w.focus();
                        w.print(); } }, 1500);
            }, 100);
        }

        function exportToWord() {
            showToast('Generating Word...');
            const cvInner = document.getElementById('cv-capture-area').innerHTML;
            const fontLinks = Array.from(document.querySelectorAll('link[rel="stylesheet"]'))
                .map(l => `<link rel="stylesheet" href="${l.href}">`).join('\n');
            const cs = state.cvFontSize;
            const html = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="UTF-8">${fontLinks}<style>@page{size:210mm 297mm;margin:15mm}:root{--cv-font-size:${cs}pt}body{font-family:${state.selectedFont};background:${paperBg[state.paperColor]||'#fff'};color:${paperFg[state.paperColor]||'#111'}}.cv-content{font-size:var(--cv-font-size)}.cv-content h1{font-size:calc(var(--cv-font-size)*2.2)}.section-title{font-weight:700;border-bottom:1.5px solid #333;padding-bottom:3px;margin-bottom:10px;text-transform:uppercase;font-size:calc(var(--cv-font-size)*.95)}.skill-tag{display:inline-block;padding:2px 8px;background:#f0f0f0;border-radius:3px;font-size:calc(var(--cv-font-size)*.82);margin:2px}.cert-tag{display:inline-block;padding:2px 8px;background:#e8f0fe;color:#1a3a6b;border-radius:3px;font-size:calc(var(--cv-font-size)*.82);margin:2px;font-weight:600}.job-title{font-weight:700}.job-company{font-style:italic;opacity:.75}</style></head><body>${cvInner}</body></html>`;
            const blob = new Blob(['\ufeff' + html], { type: 'application/msword;charset=utf-8' });
            saveAs(blob, `${state.personal.name.replace(/[^a-zA-Z0-9]/g,'_')}_CV.doc`);
            setTimeout(() => showToast('Word exported! ✅'), 500);
        }

        // ==================== EDITORS ====================
        function initPersonalEditor() {
            const editor = document.getElementById('personalEditor');
            const fields = [
                { id: 'name', label: 'Full Name', type: 'text' }, { id: 'title', label: 'Job Title',
            type: 'text' },
                { id: 'email', label: 'Email', type: 'email' }, { id: 'phone', label: 'Phone', type: 'tel' },
                { id: 'location', label: 'Location', type: 'text' }, { id: 'linkedin', label: 'LinkedIn',
                    type: 'text' },
                { id: 'summary', label: 'Professional Summary', type: 'textarea' }, ];
            editor.innerHTML = fields.map(f => f.type === 'textarea' ?
                `<div><label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">${f.label}</label><textarea oninput="state.personal['${f.id}']=this.value;renderCV()" rows="2" class="input-field text-sm">${state.personal[f.id]||''}</textarea></div>` :
                `<div><label class="block text-[9px] uppercase font-bold text-slate-500 mb-1">${f.label}</label><input type="${f.type}" value="${(state.personal[f.id]||'').replace(/"/g,'&quot;')}" oninput="state.personal['${f.id}']=this.value;renderCV()" class="input-field text-sm"></div>`
            ).join('');
        }

        function renderExperienceEditor() {
            document.getElementById('experienceEditor').innerHTML = state.experience.map((exp, i) => `
            <div class="bg-[#1a2332]/80 p-3 rounded-lg border border-[#1e293b]"><div class="flex justify-between items-center mb-2"><span class="text-[9px] font-bold text-slate-500">Exp #${i+1}</span><button onclick="removeExperience(${i})" class="text-red-400 hover:text-red-300 text-xs font-bold px-1">✕</button></div>
            <input value="${(exp.title||'').replace(/"/g,'&quot;')}" oninput="state.experience[${i}].title=this.value;renderCV()" placeholder="Job Title" class="input-field text-xs mb-1.5">
            <input value="${(exp.company||'').replace(/"/g,'&quot;')}" oninput="state.experience[${i}].company=this.value;renderCV()" placeholder="Company" class="input-field text-xs mb-1.5">
            <input value="${(exp.period||'').replace(/"/g,'&quot;')}" oninput="state.experience[${i}].period=this.value;renderCV()" placeholder="Period" class="input-field text-xs mb-1.5">
            <textarea oninput="state.experience[${i}].description=this.value;renderCV()" rows="2" placeholder="Description" class="input-field text-xs resize-none">${exp.description||''}</textarea></div>`).join(
                '');
        }

        function renderEducationEditor() {
            document.getElementById('educationEditor').innerHTML = state.education.map((edu, i) => `
            <div class="bg-[#1a2332]/80 p-3 rounded-lg border border-[#1e293b]"><div class="flex justify-between items-center mb-2"><span class="text-[9px] font-bold text-slate-500">Form #${i+1}</span><button onclick="removeEducation(${i})" class="text-red-400 hover:text-red-300 text-xs font-bold px-1">✕</button></div>
            <input value="${(edu.degree||'').replace(/"/g,'&quot;')}" oninput="state.education[${i}].degree=this.value;renderCV()" placeholder="Degree" class="input-field text-xs mb-1.5">
            <input value="${(edu.school||'').replace(/"/g,'&quot;')}" oninput="state.education[${i}].school=this.value;renderCV()" placeholder="School" class="input-field text-xs mb-1.5">
            <input value="${(edu.year||'').replace(/"/g,'&quot;')}" oninput="state.education[${i}].year=this.value;renderCV()" placeholder="Year" class="input-field text-xs"></div>`).join(
                '');
        }

        function addExperience() { state.experience.push({ title: '', company: '', period: '',
            description: '' });
            renderExperienceEditor();
            renderCV(); }

        function removeExperience(i) { state.experience.splice(i, 1);
            renderExperienceEditor();
            renderCV(); }

        function addEducation() { state.education.push({ degree: '', school: '', year: '' });
            renderEducationEditor();
            renderCV(); }

        function removeEducation(i) { state.education.splice(i, 1);
            renderEducationEditor();
            renderCV(); }

        function showToast(m) {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = m;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity = '0';
                t.style.transition = 'opacity 0.25s';
                setTimeout(() => t.remove(), 250); }, 1500);
        }

        function init() {
            document.documentElement.style.setProperty('--cv-font-size', state.cvFontSize + 'pt');
            document.getElementById('fontSizeDisplay').textContent = state.cvFontSize + 'pt';
            initPersonalEditor();
            renderExperienceEditor();
            renderEducationEditor();
            document.getElementById('skillsInput').value = state.skills.join(', ');
            document.getElementById('languagesInput').value = state.languages.join(', ');
            document.getElementById('certificationsInput').value = state.certifications.join(', ');
            document.getElementById('cv-capture-area').style.fontFamily = state.selectedFont;
            renderCV();
        }
        window.onload = init;
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('fontSheet').classList.remove('show');
                document.getElementById('templateSheet').classList.remove('show');
                closeMobileSidebar();
            }
        });
    </script>
</body>
</html>
